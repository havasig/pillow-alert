name: Pillow Alert
on:
  schedule:
    - cron: '0 5,17 * * *'  # 7 AM and 7 PM Budapest time (UTC+2 summer)
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python check_weather.py
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_HAVAG: ${{ secrets.PUSHOVER_USER_HAVAG }}
          PUSHOVER_USER_ENCI: ${{ secrets.PUSHOVER_USER_ENCI }}
